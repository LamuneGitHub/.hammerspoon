# Cursor Mode 키 맵핑 설정 파일 (lamune_cursor_mode.ini)
# 형식: 기능(대상키 또는 액션명) = [조합키+]단축키
# 참고: 단축키를 비워두면(예: copy_line = ) 해당 기능은 바인딩되지 않습니다.
# 주의: 세미콜론(;)이 단축키로 사용되므로 주석은 반드시 # 을 사용하세요.

[Settings]
# (PRE) karabiner에서 capslock을 f13으로 사전 매핑
toggle_key = f13

[NavMappings]
# -------------------------------------------------------------------------
# 이동 및 삭제 키 기본 맵핑
# (shift, cmd, alt, cmd+shift, alt+shift, cmd+alt, cmd+alt+shift 조합 자동 생성)
pageup = y
pagedown = h
home = n
end = m

left = j
right = l
up = i
down = k

# 이미 alt가 포함된 키는 내부에서 중복 조합키를 제거하므로
# shift+h -> shift+alt+left 등으로 정상 매핑됨
alt+left = u                # back word
alt+right = o               # forward word

# delete = ' 에서 생성된 alt+'(단어 삭제) 등은 그대로 유지되면서,
# cmd+' 및 cmd+alt+' 등은 아래에 정의된 forwarddelete = cmd+' 가 덮어씀
delete = [                  # delete ⬅️
forwarddelete = ]       # forward delete ➡️

[KeyMappings]
# -------------------------------------------------------------------------
# 단일 키 맵핑 설정 (자동 조합 생성이 필요 없는 개별 키 추가용)
# cmd+left = h              # beginning of line
# cmd+right = ;             # end of line

[FunctionMappings]
# -------------------------------------------------------------------------
copy = ;                    # cmd + c
copy_right = cmd+;          # 뒤쪽 복사
copy_left = alt+;           # 앞쪽 복사
copy_line = shift+;         # 한줄 복사

# -------------------------------------------------------------------------
paste = p                   # cmd + v
paste_line = cmd+p          # 현재 줄에 클립보드 내용 삽입

# -------------------------------------------------------------------------
new_line = '                # 새로운 라인
new_line_up = alt+'         # 새로운 라인 (위쪽)
duplicate_line = cmd+'    # 줄 복제

# -------------------------------------------------------------------------
delete_line = /             # 한줄 삭제
cut_line = shift+/          # 한줄 잘라내기

# comment_line = cmd+/          # 한줄 주석
# uncomment_line = cmd+alt+/    # 한줄 주석 해제
